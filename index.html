<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1026">
<title>Lucas Soldat : Opération Planète Prout</title>
<link rel="icon" href="assets/icone.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="devbar">
  <span class="devtitle">Lucas Soldat</span>
  <div class="devbtns">
    <button data-mode="browser">🖥️ Navigateur</button>
    <button data-mode="phone">📱 Téléphone Android</button>
    <button id="rotateBtn">🔄 Tourner</button>
  </div>
</div>

<div id="stage">
  <div id="device">
    <div id="game">
      <canvas id="view"></canvas>

      <div id="hud" class="hidden">
        <div id="xpbar" class="heroOnly"><div id="xpfill"></div><span id="lvl">NIV 1</span></div>
        <div id="toprow">
          <div id="hpbox" class="heroOnly"><span class="ico">❤️</span><div id="hpbar"><div id="hpfill"></div></div></div>
          <div id="timer" class="heroOnly">3:00</div>
          <div id="kills" class="heroOnly">💨 0</div>
          <div class="money rtsOnly"><img src="assets/icones/ico_8.webp" alt=""><span id="money">0</span></div>
          <div id="wave" class="rtsOnly"></div>
          <div id="nestsLeft" class="rtsOnly"></div>
          <button id="pauseBtn" aria-label="Pause">⏸</button>
        </div>
        <div id="bossbar" class="hidden"><span id="bossname"></span><div class="bar"><div id="bossfill"></div></div></div>
        <div id="radio" class="hidden"><img class="avatar" id="radioimg" src="assets/sergent/sergent_1.webp" alt=""><div class="txt"><b>SERGENT POUET</b><p id="radiotext"></p></div></div>
        <div id="weapons" class="heroOnly"></div>
        <button id="skillBtn" class="heroOnly" aria-label="Méga-Prout"><span><img src="assets/icones/ico_4.webp" alt=""></span><b>MÉGA-PROUT</b><i></i></button>
        <canvas id="minimap" class="rtsOnly" width="240" height="240"></canvas>
        <img id="mmframe" class="rtsOnly" src="assets/ui/ui_7.webp" alt="">
        <div id="rtsPanel" class="rtsOnly"></div>
        <div id="powers" class="rtsOnly"></div>
        <div id="pointer" class="hidden">➤</div>
        <div id="banner" class="hidden"></div>
      </div>

      <div id="joy" class="hidden"><div id="joyKnob"></div></div>
      <div id="selbox" class="hidden"></div>
      <div id="flash"></div>
      <div id="screens"></div>
      <div id="loading"><span id="loadtext">Chargement de la planète Prout…</span><div class="lbar"><div id="loadfill"></div></div></div>
    </div>
    <div id="punch"></div>
  </div>
</div>

<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
